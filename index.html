<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGL Builds Menu</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .card { display: block; padding: 1.25rem; border: 1px solid #d0d7de; border-radius: 8px; text-decoration: none; color: inherit; }
    .card:hover { border-color: #0969da; }
  </style>
</head>
<body>
  <h1>WebGL Builds</h1>
  <div class="grid">
    <a class="card" href="./game-one/index.html">
      <h2>Build 1</h2>
      <p>Launch first WebGL build</p>
    </a>
    <a class="card" href="./game-two/index.html">
      <h2>Build 2</h2>
      <p>Launch second WebGL build</p>
    </a>
  </div>
</body>
</html>
